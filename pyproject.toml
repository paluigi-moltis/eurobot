[project]
name = "eurobot"
version = "0.1.1"
description = "Autonomous euro-area economic reporting pipeline"
requires-python = ">=3.11"
dependencies = [
    "sdmx1>=2.20.0",
    "pandas>=2.2.0",
    "plotly>=5.24.0",
    "feedparser>=6.0.11",
    "llm-pycascade>=0.1.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eurobot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
